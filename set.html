<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind OTP Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="set.js" defer></script>
    <link rel="stylesheet" href="setout.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-poppins bg-[url(/bg.jpg)] bg-cover bg-center bg-fixed custom-bg">

    <div class="bg-white/10 p-8 rounded-2xl shadow-2xl w-full max-w-sm md:max-w-lg text-center backdrop-blur-md border border-white/20 transition duration-300 transform hover:scale-110 hover:shadow-3xl">
        
        <h1 class="text-4xl font-bold text-white mb-8 drop-shadow-lg">Secure OTP Generator</h1>

        <div class="bg-black/20 text-white text-4xl font-mono tracking-wide py-8 px-4 mb-6 rounded-xl select-all border border-white/10">
            <span id="display">Generate OTP</span>
        </div>
        
        <div class="text-2xl mb-8">
            <h2 class="text-xl font-bold text-white mb-3">OTP History (Last 15):</h2>
            <div id="history-box" class="bg-black/20 h-40 overflow-y-auto scrollbar-hidden p-4 rounded-xl text-xl font-mono text-white/90 border border-white/10">
                No OTPs generated yet.
            </div>
        </div>

        <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-8">
            
            <button id="start" class="flex-1 bg-[#e7aa12] hover:bg-[#e8ce7f] text-black font-bold text-xl py-3 px-4 rounded-2xl transition duration-300 transform hover:scale-110 shadow-2xl hover:shadow-3xl">
                Start Generation
            </button>
            
            <button id="stop" class="flex-1 bg-[#e7aa12] hover:bg-[#e8ce7f] text-black font-bold text-xl py-3 px-4 rounded-2xl transition duration-300 transform hover:scale-110 shadow-2xl hover:shadow-3xl">
                Stop Generation
            </button>
            
        </div>
    </div>

</body>
</html>
